apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdarena-frontend
  namespace: gdarena
  labels:
    app: gdarena-frontend
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gdarena-frontend
  template:
    metadata:
      labels:
        app: gdarena-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: gdarena-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gdarena-frontend-svc
  namespace: gdarena
  labels:
    app: gdarena-frontend
spec:
  type: ClusterIP
  selector:
    app: gdarena-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
