apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gdarena-ingress
  namespace: gdarena
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  tls:
    - hosts:
        - gdarena.app
      secretName: gdarena-tls-cert
  rules:
    - host: gdarena.app
      http:
        paths:
          # Route API traffic to backend cluster service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gdarena-backend-svc
                port:
                  number: 5000
          # Route client SPA traffic to frontend cluster service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gdarena-frontend-svc
                port:
                  number: 80
