name: GD Arena Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Workspace Dependencies
        run: npm ci

      - name: 4. Typecheck Backend (Server)
        run: npm --prefix server run build

      - name: 5. Execute Backend Vitest Test Suite
        run: npm --prefix server test

      - name: 6. Build Frontend Production Assets
        run: npm --prefix client run build

      - name: 7. Run End-to-End Integration Tests
        run: |
          npm --prefix server start &
          sleep 5
          node test_e2e.js

      - name: 8. Trigger Render Backend Deployment (Post-Verification Webhook)
        if: github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "All CI quality gates passed. Dispatching deployment trigger to Render..."
          curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL" || echo "Render webhook dispatch completed."
