name: GD Arena Container Build & Security Scan (CD)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  docker-build-and-scan:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: gdarena-backend:latest
          load: true

      - name: 4. Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: false
          tags: gdarena-frontend:latest
          load: true

      - name: 5. Container Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gdarena-backend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: 6. Deployment Notification
        run: |
          echo "GD Arena Containers built and verified for deployment."
