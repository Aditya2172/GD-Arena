---
# Role: security - server hardening & firewall configuration

- name: Set UFW default incoming policy to deny
  ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy to allow
  ufw:
    direction: outgoing
    policy: allow

- name: Allow incoming traffic on required service ports
  ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_allowed_ports }}"

- name: Enable UFW service
  ufw:
    state: enabled
